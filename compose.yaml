services:
  back:
    build: ./back/
    ports:
      - "${API_PORT}:80"
    volumes:
      - ./back/:/app
      - main:/app
  db:
    image: postgres
      restart: always
    shm_size: 128mb
    volumes:
      - .:/db
      - db:/db
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "${DB_PORT}:5432"
  adminer:
    image: adminer
    restart: always
    ports:
      - "${ADMINER_PORT}:${ADMINER_PORT}"
volumes:
  main:
  db:
